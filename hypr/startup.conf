# env = XCURSOR_THEME=Phinger Dark
# env = XCURSOR_SIZE,12
# env = HYPRCURSOR_THEME=Phinger Dark
# env = HYPRCURSOR_SIZE,12

# workspaces
exec-once = hyprctl dispatch workspaces 1
exec-once = hyprctl dispatch workspaces 2
exec-once = hyprctl dispatch workspaces 3
exec-once = hyprctl dispatch workspaces 4

# disable intel_pstate
exec-once = echo 1 > /sys/devices/system/cpu/intel_pstate/no_turbo
exec = ags run

# miscs
exec-once = hyprpaper
exec-once = hyprctl setcursor phinger-cursors-dark 12
exec-once = fcitx5 -d
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

cursor {
    no_hardware_cursors = true
}
