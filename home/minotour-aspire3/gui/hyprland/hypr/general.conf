env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# cursor
env = HYPRCURSOR_THEME, Bibata-Modern-Classic
env = HYPRCURSOR_SIZE, 24

# xcursor
env = XCURSOR_THEME, Bibata-Modern-Classic
env = XCURSOR_SIZE, 24

# always using native 1x scale resolution
monitor =, preferred, auto, 1

general {
    gaps_in = 5
    gaps_out = 20

    border_size = 3
    col.active_border = rgba(b276d6ee) rgba(b577d9ee)
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    layout = dwindle
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    bezier = customBezier, 0.05, 0.9, 0.1, 1.05
    
    animation = windows, 1, 7, customBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

misc {
    disable_hyprland_logo = true  # i do have some more weeb background
}

input {
    # keyboard settings
    kb_layout = us
    
    # mouse settings
    follow_mouse = 1
    focus_on_close = 0
    sensitivity = 0

    # touchpad
    touchpad {
        natural_scroll = 1
    }
}
