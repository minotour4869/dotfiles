$MOD = SUPER

# General binds
bind = $MOD, Return, exec, kitty
bind = $MOD, Q, killactive
bind = $MOD, V, togglefloating
bind = $MOD ALT, Q, exit
bind = $MOD, D, exec, dmenu_run

# move focus
bind = $MOD, H, movefocus, l
bind = $MOD, L, movefocus, r
bind = $MOD, K, movefocus, u
bind = $MOD, J, movefocus, d

# switch workspaces
bind = $MOD, 1, workspace, 1
bind = $MOD, 2, workspace, 2
bind = $MOD, 3, workspace, 3
bind = $MOD, 4, workspace, 4
bind = $MOD, 5, workspace, 5
bind = $MOD, 6, workspace, 6
bind = $MOD, 7, workspace, 7
bind = $MOD, 8, workspace, 8
bind = $MOD, 9, workspace, 9
bind = $MOD, 0, workspace, 10

# move window to workspace
bind = $MOD SHIFT, 1, movetoworkspace, 1
bind = $MOD SHIFT, 2, movetoworkspace, 2
bind = $MOD SHIFT, 3, movetoworkspace, 3
bind = $MOD SHIFT, 4, movetoworkspace, 4
bind = $MOD SHIFT, 5, movetoworkspace, 5
bind = $MOD SHIFT, 6, movetoworkspace, 6
bind = $MOD SHIFT, 7, movetoworkspace, 7
bind = $MOD SHIFT, 8, movetoworkspace, 8
bind = $MOD SHIFT, 9, movetoworkspace, 9
bind = $MOD SHIFT, 0, movetoworkspace, 10

# cycle workspaces using mouse wheel (barely used anyway)
# bindm = $MOD, mouse_down, workspace, e+1
# bindm = $MOD, mouse_up, workspace, e-1

# move/resize windows
bindm = $MOD, mouse:272, movewindow
bindm = $MOD, mouse:273, resizewindow

# screenshot
bind = , Print, exec, hyprshot -m output --clipboard-only
bind = ALT, Print, exec, hyprshot -m window --clipboard-only
bind = SHIFT, Print, exec, hyprshot -m region --clipboard-only

# using mouse as numpad
$DIS = 20

binde = , KP_HOME, exec, ydotool mousemove -- -$DIS -$DIS && sleep 0.1
binde = , KP_PRIOR, exec, ydotool mousemove -- $DIS -$DIS && sleep 0.1
binde = , KP_END, exec, ydotool mousemove -- -$DIS $DIS && sleep 0.1
binde = , KP_NEXT, exec, ydotool mousemove -- $DIS $DIS && sleep 0.1
binde = , KP_LEFT, exec, ydotool mousemove -- -$DIS 0 && sleep 0.1
binde = , KP_DOWN, exec, ydotool mousemove -- 0 $DIS && sleep 0.1
binde = , KP_UP, exec, ydotool mousemove -- 0 -$DIS && sleep 0.1
binde = , KP_RIGHT, exec, ydotool mousemove -- $DIS 0 && sleep 0.1

bind = , KP_Begin, exec, ydotool click C0
bind = , KP_DIVIDE, exec, ydotool click 0x40
bind = , KP_MULTIPLY, exec, ydotool click 0x42 0x82
bind = , KP_SUBTRACT, exec, ydotool click 0x41 0x81

bind = , KP_Insert, exec, sh -c 'if [ "$(cat /tmp/mouse/state)" = "40" ]; then echo "80" > /tmp/mouse_state && ydotool click 0x80; else echo "40" > /tmp/mouse_state && ydotool click 0x40; fi'
bind = , KP_Delete, exec, sudo pkill ydotoold
bind = , KP_Enter, exec, sudo ydotoold
